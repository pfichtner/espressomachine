name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Install AVR and LLVM toolchain
        run: |
          sudo apt-get update -y
          sudo apt-get install -y llvm-18 binutils-avr

      - name: Install websocat
        run: |
          curl -sSL https://github.com/vi/websocat/releases/download/v1.13.0/websocat.x86_64-unknown-linux-musl \
            -o /usr/local/bin/websocat
          chmod +x /usr/local/bin/websocat

      - name: Build compiler backend
        run: mvn package -q -f teavm-backend/llvm/pom.xml

      - name: Compile examples
        run: mvn compile -q -f examples/pom.xml

      - name: Run tests
        run: RUN_INTEGRATION_TESTS=1 bash tests/run.sh

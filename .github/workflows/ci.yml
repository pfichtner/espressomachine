name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Install AVR and LLVM toolchain
        run: |
          sudo apt-get update -y
          sudo apt-get install -y llvm-18 binutils-avr

      - name: Build compiler backend
        run: mvn package -q -f teavm-backend/llvm/pom.xml

      - name: Compile examples
        run: mvn compile -q -f examples/pom.xml

      - name: Run tests
        run: bash tests/run.sh

      - name: Install Node.js dependencies
        run: npm ci

      - name: Run virtualavr system test
        run: bash tests/systemtest-blink.sh
